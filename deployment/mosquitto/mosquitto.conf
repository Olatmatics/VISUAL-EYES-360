# Local MQTT broker for device telemetry.
# Not exposed to the public internet in this foundation stage.
# Field-device access needs TLS on 8883 plus per-device credentials (see README).

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

include_dir /mosquitto/config/conf.d
